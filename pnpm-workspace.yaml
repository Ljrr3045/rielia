packages:
  - apps/*
  - packages/*

saveExact: true
strictPeerDependencies: true
autoInstallPeers: false

# NodeAdapter 12.3.2 pins vulnerable qs 6.16.0. Preserve the former backend's
# patched 6.16.1 floor for GHSA-6pq8-jhm2-2vcw until the adapter updates its pin.
overrides:
  '@nestjs/platform-node>qs': 6.16.1

# Prisma's pinned engine downloader and runtime compatibility check are needed
# for schema tooling. All other new dependency lifecycle scripts remain denied.
allowBuilds:
  '@prisma/engines@7.10.1': true
  'prisma@7.10.1': true
  # Published Inspector includes built clients. Its source-checkout installer
  # is a no-op under node_modules; keep that unnecessary lifecycle disabled.
  '@modelcontextprotocol/inspector@2.12.0': false
patchedDependencies:
  better-auth@1.7.12: patches/better-auth@1.7.12.patch
  pg-boss@12.38.0: patches/pg-boss@12.38.0.patch
# NodeAdapter first shipped today (2026-10-27). Exact reviewed/source-inspected
# Nest 12.3.2 exceptions, accepted by the coordinator; no blanket age bypass.
# See docs/development/nest-http-adapter.md for maturity and integrity evidence.
minimumReleaseAgeExclude:
  - '@nestjs/common@12.3.2'
  - '@nestjs/core@12.3.2'
  - '@nestjs/platform-node@12.3.2'
