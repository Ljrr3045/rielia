name: OpenCode inline request

on:
  pull_request_review_comment:
    types: [created]

# Fork events cannot receive secrets. This workflow only transports identifiers;
# the trusted workflow_run consumer refetches and authorizes everything.
permissions: {}

jobs:
  relay:
    if: github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record identifiers as JSON data (no checkout or credentials)
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const request = {
            pull_request: event.pull_request.number,
            comment_id: event.comment.id,
            run_id: Number(process.env.GITHUB_RUN_ID),
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            head_sha: process.env.GITHUB_SHA,
            head_repository: event.pull_request.head.repo.full_name,
          };
          fs.writeFileSync('inline-request.json', JSON.stringify(request));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-inline-${{ github.run_id }}-${{ github.run_attempt }}
          path: inline-request.json
          retention-days: 1
          if-no-files-found: error
