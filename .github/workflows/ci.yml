name: Repository governance CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify repository ownership
        run: printf '%s\n' '* @Ljrr3045' | cmp - .github/CODEOWNERS
      - name: Verify proposed-change whitespace
        run: git diff --check HEAD^ HEAD
