name: OpenCode PR Review

on:
  pull_request:
    branches-ignore:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: write
    env:
      OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL || 'deepseek-v4.1-flash' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review PR with OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "model": ${{ toJSON(format('opencode-go/{0}', env.OPENCODE_MODEL)) }},
              "small_model": ${{ toJSON(format('opencode-go/{0}', env.OPENCODE_MODEL)) }},
              "enabled_providers": ["opencode-go"],
              "provider": {
                "opencode-go": {
                  "whitelist": [${{ toJSON(env.OPENCODE_MODEL) }}]
                }
              }
            }
        with:
          model: opencode-go/${{ env.OPENCODE_MODEL }}
          use_github_token: true
          prompt: |
            Review the changes in this pull request and post your findings
            as a comment on the PR, in English.
            Prioritize bugs, regressions, security issues, and missing tests
            that address concrete risks introduced by the changes.
            For each finding, include the severity, file, line number, and
            a brief explanation of the issue and its impact.
            Avoid purely stylistic feedback and speculative issues.
            If you find no relevant issues, state that clearly.
            Limit your work to reviewing: do not modify files, create commits,
            create branches, or merge the PR.
